[project]
name = "travel-planner"
version = "0.1.0"
description = "AI Travel Planner Agent powered by LangGraph & Gemini"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "langchain==1.2.15",
    "langgraph==1.1.6",
    "langchain-google-genai",
    "serpapi==1.0.2",
    "streamlit==1.56.0",
    "pydantic==2.13.0",
    "python-dotenv",
    "rich==15.0.0",
    "requests==2.33.1",
    "streamlit-js-eval>=1.0.0",
    "prompt-toolkit>=3.0.52",
    "googlemaps",
    "fastapi==0.135.3",
    "uvicorn==0.44.0",
    "langchain-core==1.2.29",
    "streamlit-folium>=0.27.1",
    "langchain-nvidia-ai-endpoints>=1.2.1",
    "ruff==0.15.10",
    "langchain-moonshot>=0.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]
