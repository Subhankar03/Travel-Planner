[project]
name = "travel-planner"
version = "0.1.0"
description = "AI Travel Planner Agent powered by LangGraph & Gemini"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "langchain==1.2.13",
    "langgraph==1.1.3",
    "langchain-google-genai",
    "serpapi",
    "streamlit",
    "pydantic",
    "python-dotenv",
    "rich",
    "requests==2.33.1",
    "streamlit-js-eval>=1.0.0",
    "prompt-toolkit>=3.0.52",
    "googlemaps",
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "ruff==0.15.8",
    "langchain-core>=1.2.19",
]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
]
