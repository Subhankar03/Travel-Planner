<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlideTrip — AI Travel Copilot</title>
  <meta name="description" content="Plan your entire trip in one conversation. Flights, hotels, local places — all through AI.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── LANDING HERO ──────────────────────────────────────────────────────── -->
<div class="landing" id="landing">
  <nav class="landing-nav">
    <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
    <span class="logo-text">GlideTrip</span>
  </nav>

  <div class="landing-content">
    <h1 class="landing-title">One conversation.<br>Your entire trip planned.</h1>
    <p class="landing-subtitle">Flights, hotels, restaurants, directions — handled by AI agents that search in real-time while you chat.</p>

    <form class="landing-input-wrap" id="landingForm">
      <input type="text" class="landing-input" id="landingInput" placeholder="Where are you headed?" autocomplete="off">
      <button type="submit" class="landing-send" id="landingSend">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>

    <div class="chips">
      <button type="button" class="chip" data-query="Weekend getaway to Goa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
        Weekend getaway to Goa
      </button>
      <button type="button" class="chip" data-query="Budget trip to Manali">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l4 8 5-5 5 15H2L8 3z"/><path d="M4.14 15.08c2.62-1.57 5.24-1.43 7.86.42 2.74 1.94 5.49 2 8.23.19"/></svg>
        Budget trip to Manali
      </button>
      <button type="button" class="chip" data-query="Explore Kochi restaurants and backwaters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Explore Kochi cuisine
      </button>
    </div>

    <div class="badges">
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
        Flights
      </span>
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 22V4a2 2 0 012-2h8a2 2 0 012 2v18z"/><path d="M6 12H4a2 2 0 00-2 2v6a2 2 0 002 2h2"/><path d="M18 9h2a2 2 0 012 2v9a2 2 0 01-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>
        Hotels
      </span>
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Local Places
      </span>
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 000-7h-11a3.5 3.5 0 010-7H15"/><circle cx="18" cy="5" r="3"/></svg>
        Directions
      </span>
    </div>
  </div>

  <footer class="landing-footer">Powered by Gemini &middot; LangGraph &middot; SerpAPI</footer>
</div>

<!-- ── COPILOT LAYOUT ────────────────────────────────────────────────────── -->
<div class="copilot" id="copilot">

  <!-- Chat Panel -->
  <div class="chat-panel">
    <header class="chat-header">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
      <span class="logo-text" style="color:var(--accent)">GlideTrip</span>
    </header>

    <div class="chat-feed" id="chatFeed">
      <!-- Messages injected by JS -->
    </div>

    <div class="chat-input-wrap">
      <div class="chat-input-inner">
        <textarea class="chat-input" id="chatInput" placeholder="Ask about your trip..." rows="1"></textarea>
        <button class="chat-send" id="chatSend">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="panel-divider"></div>

  <!-- Results Panel -->
  <div class="results-panel">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="flights">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
        Flights <span class="tab-count">(4)</span>
      </button>
      <button class="tab-btn" data-tab="hotels">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 22V4a2 2 0 012-2h8a2 2 0 012 2v18z"/><path d="M6 12H4a2 2 0 00-2 2v6a2 2 0 002 2h2"/><path d="M18 9h2a2 2 0 012 2v9a2 2 0 01-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>
        Hotels <span class="tab-count">(3)</span>
      </button>
      <button class="tab-btn" data-tab="places">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Places <span class="tab-count">(4)</span>
      </button>
    </div>

    <div class="results-content" id="resultsContent">
      <!-- Flights tab -->
      <div class="tab-content active" data-panel="flights" id="flightsPanel"></div>
      <!-- Hotels tab -->
      <div class="tab-content" data-panel="hotels" id="hotelsPanel"></div>
      <!-- Places tab -->
      <div class="tab-content" data-panel="places" id="placesPanel"></div>
    </div>

    <div class="map-area">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>Map integration coming soon</span>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
